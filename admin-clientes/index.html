<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panel Presagio</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#16191d}.w{max-width:1280px;margin:30px auto;padding:16px}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{padding:10px 14px;border:1px solid #ccd2da;background:white;border-radius:10px;cursor:pointer;font-weight:700}.tabs button.on{background:#111827;color:white}.c{background:white;border:1px solid #d9dde3;border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px;vertical-align:top}th{background:#fafafa;position:sticky;top:0}.muted{color:#667085}.hide{display:none}.detail{max-width:420px;white-space:pre-wrap}</style></head><body><div class="w"><h1>Presagio · Clientes y consultas</h1><p class="muted">Panel privado.</p><div class="tabs"><button id="bCli" class="on">Clientes</button><button id="bCon">Consultas</button></div><div id="clients" class="c"><p id="ce" style="padding:15px">Cargando…</p><table id="ct" hidden><thead><tr><th>ID</th><th>Nombre</th><th>Empresa</th><th>WhatsApp</th><th>Email</th><th>Promos</th><th>Fecha</th><th>Origen</th></tr></thead><tbody></tbody></table></div><div id="consultas" class="c hide"><p id="qe" style="padding:15px">Cargando…</p><table id="qt" hidden><thead><tr><th>ID</th><th>Cliente</th><th>WhatsApp</th><th>Servicio</th><th>Detalle</th><th>Origen</th><th>Campaña</th><th>Estado</th><th>Fecha</th></tr></thead><tbody></tbody></table></div></div><script>
const bCli=document.querySelector('#bCli'),bCon=document.querySelector('#bCon'),clients=document.querySelector('#clients'),consultas=document.querySelector('#consultas');bCli.onclick=()=>{clients.classList.remove('hide');consultas.classList.add('hide');bCli.classList.add('on');bCon.classList.remove('on')};bCon.onclick=()=>{consultas.classList.remove('hide');clients.classList.add('hide');bCon.classList.add('on');bCli.classList.remove('on')};
(async()=>{try{let r=await fetch('/admin-clientes/api/clientes',{cache:'no-store'});if(!r.ok)throw Error('No se pudo cargar clientes.');let d=await r.json(),t=document.querySelector('#ct'),tb=t.querySelector('tbody');for(let c of(d.clientes||[])){let tr=document.createElement('tr');for(let v of[c.id,c.nombre,c.empresa,c.whatsapp,c.email,c.promos?'Sí':'No',c.creado_en,c.origen]){let td=document.createElement('td');td.textContent=v??'';tr.appendChild(td)}tb.appendChild(tr)}document.querySelector('#ce').hidden=true;t.hidden=false}catch(e){document.querySelector('#ce').textContent=e.message}})();
(async()=>{try{let r=await fetch('/admin-clientes/api/consultas',{cache:'no-store'});if(!r.ok)throw Error('No se pudo cargar consultas.');let d=await r.json(),t=document.querySelector('#qt'),tb=t.querySelector('tbody');for(let q of(d.consultas||[])){let tr=document.createElement('tr');let vals=[q.id,(q.nombre||q.email)+(q.empresa?' · '+q.empresa:''),q.whatsapp,q.servicio,q.detalle,q.origen,q.campana,q.estado,q.creado_en];vals.forEach((v,i)=>{let td=document.createElement('td');td.textContent=v??'';if(i===4)td.className='detail';tr.appendChild(td)});tb.appendChild(tr)}document.querySelector('#qe').hidden=true;t.hidden=false}catch(e){document.querySelector('#qe').textContent=e.message}})();
</script></body></html>
