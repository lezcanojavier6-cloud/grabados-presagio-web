<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Clientes | Grabados Presagio</title>
  <style>
    :root{--bg:#090b10;--panel:#11151c;--panel2:#171c25;--txt:#f5f7fb;--muted:#aeb7c5;--line:#252d39;--blue:#4d9cff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#172334 0,#090b10 34%,#07090d 75%);color:var(--txt);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    .wrap{max-width:1280px;margin:auto;padding:28px 20px 50px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1px solid #465161}
    h1{margin:0;font-size:clamp(26px,4vw,40px);letter-spacing:-1px}.sub{color:var(--muted);font-size:14px;margin-top:3px}.panel{background:linear-gradient(180deg,#121923,#0c1118);border:1px solid #2a3544;border-radius:22px;padding:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
    .stat{background:#0d1219;border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{display:block;font-size:28px}.stat span{color:var(--muted);font-size:13px}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 190px auto auto;gap:10px;margin-bottom:16px}
    input,select,button{font:inherit;border-radius:12px;border:1px solid #344154;background:#0b1017;color:#fff;padding:12px 13px}input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,156,255,.12)}button{cursor:pointer;font-weight:750}
    .primary{background:linear-gradient(135deg,#eef3f8,#9ba9ba 45%,#4d9cff);color:#07101c;border:0}.ghost{background:#10151d}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:980px;background:#0c1117}
    th,td{padding:12px 13px;text-align:left;border-bottom:1px solid #202936;vertical-align:top}th{position:sticky;top:0;background:#131922;color:#cbd5e1;font-size:12px;text-transform:uppercase;letter-spacing:.5px}td{font-size:14px;color:#e7edf5}tr:hover td{background:#101720}.muted{color:var(--muted)}
    .pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:750;border:1px solid}.yes{color:#bbf7d0;border-color:#22543d;background:#0f2b22}.no{color:#cbd5e1;border-color:#3a4555;background:#161b23}.wa{color:#b8e9c8;text-decoration:none}.email{color:#b9d8ff;text-decoration:none}
    .status{margin-top:14px;color:var(--muted);font-size:13px;min-height:20px}.empty{padding:30px;text-align:center;color:var(--muted)}.foot{margin-top:14px;color:#8390a2;font-size:12px}
    @media(max-width:850px){.stats{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}}@media(max-width:560px){.toolbar{grid-template-columns:1fr}.wrap{padding:18px 12px 35px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <img src="/assets/logo-presagio.png" alt="Grabados Presagio">
        <div><h1>Clientes Presagio</h1><div class="sub">Panel privado de contactos registrados</div></div>
      </div>
      <button class="ghost" id="refreshBtn" type="button">Actualizar</button>
    </div>

    <div class="panel">
      <div class="stats">
        <div class="stat"><b id="statTotal">—</b><span>Clientes encontrados</span></div>
        <div class="stat"><b id="statPromos">—</b><span>Aceptan promociones</span></div>
        <div class="stat"><b id="statNoPromos">—</b><span>Sin promociones</span></div>
      </div>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Buscar nombre, empresa, WhatsApp o email">
        <select id="promos">
          <option value="">Todos</option>
          <option value="1">Aceptan promociones</option>
          <option value="0">No aceptan promociones</option>
        </select>
        <button class="ghost" id="searchBtn" type="button">Buscar</button>
        <button class="primary" id="csvBtn" type="button">Exportar CSV</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Nombre</th><th>Empresa</th><th>WhatsApp</th><th>Email</th><th>Promos</th><th>Alta</th><th>Origen</th></tr></thead>
          <tbody id="rows"><tr><td colspan="8" class="empty">Cargando clientes…</td></tr></tbody>
        </table>
      </div>

      <div id="status" class="status"></div>
      <div class="foot">Este panel no muestra IP, hash de IP ni user-agent. Protegelo con Cloudflare Access antes de publicarlo.</div>
    </div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id), rows = $('rows'), status = $('status');
  let current = [];
  function esc(v){return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
  function fmtDate(v){
    if(!v) return '';
    const d = new Date(String(v).replace(' ','T')+'Z');
    if(Number.isNaN(d.getTime())) return v;
    return new Intl.DateTimeFormat('es-AR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'America/Argentina/Buenos_Aires'}).format(d);
  }
  async function load(){
    const params = new URLSearchParams(), q=$('search').value.trim(), promos=$('promos').value;
    if(q) params.set('q',q); if(promos!=='') params.set('promos',promos); params.set('limit','500');
    status.textContent='Consultando base de clientes…'; rows.innerHTML='<tr><td colspan="8" class="empty">Cargando clientes…</td></tr>';
    try{
      const r=await fetch('/admin-clientes/api/clientes?'+params.toString(),{headers:{Accept:'application/json'},cache:'no-store'});
      if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'No se pudo consultar la base de clientes.');}
      const data=await r.json(); current=Array.isArray(data.clientes)?data.clientes:[];
      $('statTotal').textContent=data.resumen?.total??current.length; $('statPromos').textContent=data.resumen?.promos??'—'; $('statNoPromos').textContent=data.resumen?.sin_promos??'—';
      if(!current.length) rows.innerHTML='<tr><td colspan="8" class="empty">No se encontraron clientes con ese filtro.</td></tr>';
      else rows.innerHTML=current.map(c=>`<tr><td>${esc(c.id)}</td><td><strong>${esc(c.nombre)}</strong></td><td>${esc(c.empresa||'')}</td><td><a class="wa" href="https://wa.me/${encodeURIComponent(String(c.whatsapp||'').replace(/[^\d]/g,''))}" target="_blank" rel="noopener">${esc(c.whatsapp||'')}</a></td><td><a class="email" href="mailto:${esc(c.email||'')}">${esc(c.email||'')}</a></td><td>${Number(c.promos)===1?'<span class="pill yes">Sí</span>':'<span class="pill no">No</span>'}</td><td>${esc(fmtDate(c.creado_en))}</td><td class="muted">${esc(c.origen||'')}</td></tr>`).join('');
      status.textContent=`${current.length} registro(s) mostrados.`;
    }catch(e){current=[];rows.innerHTML='<tr><td colspan="8" class="empty">No se pudo cargar la información.</td></tr>';status.textContent=e.message||'Error al consultar clientes.';}
  }
  function csvCell(v){const s=String(v??'').replace(/\r?\n/g,' ').trim();return '"'+s.replace(/"/g,'""')+'"';}
  function exportCSV(){
    if(!current.length){status.textContent='No hay registros para exportar.';return;}
    const lines=[['ID','Nombre','Empresa','WhatsApp','Email','Promos','Creado en','Origen'].map(csvCell).join(';')];
    for(const c of current) lines.push([c.id,c.nombre,c.empresa,c.whatsapp,c.email,Number(c.promos)===1?'SI':'NO',c.creado_en,c.origen].map(csvCell).join(';'));
    const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`clientes-presagio-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  }
  $('searchBtn').addEventListener('click',load);$('refreshBtn').addEventListener('click',load);$('csvBtn').addEventListener('click',exportCSV);$('promos').addEventListener('change',load);$('search').addEventListener('keydown',e=>{if(e.key==='Enter')load();});load();
})();
</script>
</body>
</html>
